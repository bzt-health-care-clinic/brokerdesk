services:
  ocr-server:
    build: .
    restart: unless-stopped
    ports:
      - "${OCR_BIND_ADDRESS:-127.0.0.1}:${OCR_PORT:-8000}:8000"
    environment:
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:?Set OCR_SERVICE_TOKEN}
      OCR_MAX_CONCURRENT_JOBS: ${OCR_MAX_CONCURRENT_JOBS:-1}
      OCR_MAX_QUEUE_SIZE: ${OCR_MAX_QUEUE_SIZE:-20}
      OCR_LANG: ${OCR_LANG:-ch}
      OCR_DEVICE: ${OCR_DEVICE:-cpu}
      OCR_ENABLE_CONTRAST: ${OCR_ENABLE_CONTRAST:-false}
      OCR_TEMP_TTL_SECONDS: ${OCR_TEMP_TTL_SECONDS:-3600}
    volumes:
      - paddle-models:/home/nobody/.paddlex

volumes:
  paddle-models:
